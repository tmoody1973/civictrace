[project]
name = "civictrace-backend"
version = "0.1.0"
description = "CivicTrace backend: deterministic evidence workflow with bounded agents."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "google-adk>=2.7.1",
  "google-cloud-bigquery>=3.43.0",
  "google-cloud-firestore>=2.28.1",
  "google-cloud-speech>=2.40.0",
  "google-cloud-storage>=3.13.1",
  "google-cloud-tasks>=2.24.0",
  "pydantic>=2.7",
  "pypdf>=6.16.1",
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0.12.20260815",
  "httpx2>=2.12.0",
  "google-cloud-pubsub>=2.39.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = ["live: needs CIVICTRACE_LIVE=1, ADC and a GCP project (real model calls)"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose; wrapping it would change the policy strings. Replaced/reviewed in Slice 2.
"app/agents/prompts.py" = ["E501"]
# ADK adapter is pseudocode until Slice 2; the unused `instruction` is part of the outline.
"app/agents/factory.py" = ["F841"]
